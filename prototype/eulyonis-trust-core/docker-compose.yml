services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eulyonis
      POSTGRES_USER: eulyonis
      POSTGRES_PASSWORD: eulyonis_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eulyonis -d eulyonis"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - eulyonis_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://eulyonis:eulyonis_dev_only@db:5432/eulyonis
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  eulyonis_pgdata:
